packages:
  - "packages/*"
  - "apps/*"
  - "e2e"

# Single source of truth for shared dependency versions (catalog: protocol).
catalog:
  react: ^19.1.0
  react-dom: ^19.1.0
  "@types/react": ^19.1.0
  "@types/react-dom": ^19.1.0
  "@types/node": ^26.4.1
  typescript: ^5.8.3
  # exact: @wirework/schema reads zod internals for settings introspection
  zod: 3.25.76
  vite: ^6.3.5
  vitest: ^3.2.4
  "@vitejs/plugin-react": ^4.5.0
  react-grid-layout: ^2.2.4
  gridstack: ^13.3.0
  flexlayout-react: ^0.11.0
  antd: ^6.6.4
  # pinned: playwright-bdd 8.x does not support Playwright >= 1.60 ESM loader
  "@playwright/test": 1.55.0
  playwright-bdd: ^8.3.0
