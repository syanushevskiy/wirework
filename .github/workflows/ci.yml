# Typecheck, unit tests, then the Gherkin e2e suite. The e2e reports
# (cucumber HTML with every scenario's steps, Playwright HTML with traces)
# are kept as an artifact so anyone — including QA who never open a
# terminal — can see what ran and what failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: e2e/reports
          retention-days: 14
